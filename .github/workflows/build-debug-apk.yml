name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: gradle assembleDebug

      - name: Upload APK (Actions artifact, zippe)
        uses: actions/upload-artifact@v4
        with:
          name: ride-copilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier une Release avec l'APK en telechargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Ride Copilot (debug)"
          body: "APK de debug genere automatiquement a chaque push. Lien stable de telechargement direct (pas de zip) : voir les assets ci-dessous."
          files: app/build/outputs/apk/debug/app-debug.apk
